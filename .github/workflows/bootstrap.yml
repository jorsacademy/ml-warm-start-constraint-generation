name: One-time repository bootstrap

on:
  push:
    branches: [invariant-sec-warm-start]

permissions:
  contents: write

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: invariant-sec-warm-start
          fetch-depth: 0

      - name: Reconstruct and verify repository archive
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          test "$(find .bootstrap -maxdepth 1 -name 'archive.part*' -type f | wc -l)" -eq 9
          cat .bootstrap/archive.part* > /tmp/warmcg.tar.gz.b64
          base64 --decode /tmp/warmcg.tar.gz.b64 > /tmp/warmcg.tar.gz
          echo "432b418a767c5f05da7d278c035c40c2128a702f00004e7a61fcc112c88902c8  /tmp/warmcg.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/warmcg.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/ci.yml

      - name: Commit reconstructed repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && {
            echo "No reconstructed changes to commit."
            exit 0
          }
          git commit -m "Build verification-first ML constraint warm-start benchmark"
          git push origin HEAD:invariant-sec-warm-start
